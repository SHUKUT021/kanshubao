<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffd88a"/>
      <stop offset="0.5" stop-color="#ffab52"/>
      <stop offset="1" stop-color="#e96a3c"/>
    </linearGradient>
    <linearGradient id="coverC" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.55" stop-color="#ffeecf"/>
      <stop offset="1" stop-color="#f2cfa0"/>
    </linearGradient>
    <linearGradient id="spinC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6fd8"/>
      <stop offset="1" stop-color="#123a86"/>
    </linearGradient>
    <radialGradient id="irisC" cx="0.36" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#b6f0ff"/>
      <stop offset="0.4" stop-color="#48a5f0"/>
      <stop offset="1" stop-color="#0b2a5e"/>
    </radialGradient>
    <filter id="shC" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#8a2f0c" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sqC"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#sqC)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bgC)"/>
    <ellipse cx="470" cy="280" rx="330" ry="220" fill="#fff8e0" opacity="0.35"/>

    <g transform="rotate(-8 512 560)" filter="url(#shC)">
      <!-- book body -->
      <rect x="268" y="268" width="500" height="600" rx="52" fill="url(#coverC)"/>
      <rect x="268" y="268" width="500" height="600" rx="52" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9"/>
      <!-- spine -->
      <path d="M268 320 C 268 291 291 268 320 268 L 320 868 L 320 868 C 291 868 268 845 268 816 Z" fill="url(#spinC)"/>
      <rect x="300" y="268" width="16" height="600" fill="#0d2f6b" opacity="0.35"/>
      <!-- page edge -->
      <rect x="742" y="300" width="26" height="536" rx="13" fill="#ffffff" opacity="0.75"/>

      <!-- eye lens -->
      <circle cx="546" cy="486" r="128" fill="#2a1508" opacity="0.18"/>
      <circle cx="546" cy="478" r="124" fill="#12203a"/>
      <circle cx="546" cy="478" r="108" fill="url(#irisC)"/>
      <circle cx="546" cy="478" r="46" fill="#08131f"/>
      <ellipse cx="506" cy="430" rx="30" ry="20" fill="#ffffff" opacity="0.85" transform="rotate(-30 506 430)"/>
      <ellipse cx="584" cy="524" rx="12" ry="8" fill="#d6f3ff" opacity="0.5"/>

      <!-- smile -->
      <path d="M506 646 Q 546 682 588 646" fill="none" stroke="#c47b3a" stroke-width="13" stroke-linecap="round"/>
      <!-- cheeks -->
      <ellipse cx="452" cy="628" rx="22" ry="14" fill="#ff9f76" opacity="0.55"/>
      <ellipse cx="640" cy="628" rx="22" ry="14" fill="#ff9f76" opacity="0.55"/>
    </g>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>
