<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#63a4ff"/>
      <stop offset="0.55" stop-color="#2f6ae0"/>
      <stop offset="1" stop-color="#132a7a"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fdfdff"/>
      <stop offset="0.5" stop-color="#e8eefc"/>
      <stop offset="1" stop-color="#b9c8e8"/>
    </linearGradient>
    <linearGradient id="stack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9bcdd"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb6da"/>
      <stop offset="0.45" stop-color="#2b3752"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="glassB" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#a9ecff"/>
      <stop offset="0.4" stop-color="#3f8be6"/>
      <stop offset="1" stop-color="#091d3e"/>
    </radialGradient>
    <filter id="shB" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#041033" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sqB"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#sqB)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bgB)"/>
    <ellipse cx="512" cy="300" rx="360" ry="240" fill="#ffffff" opacity="0.16"/>
    <g transform="rotate(-6 512 540)" filter="url(#shB)">
      <!-- page stack -->
      <rect x="238" y="352" width="560" height="470" rx="34" fill="url(#stack)"/>
      <rect x="238" y="352" width="560" height="470" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
      <!-- cover -->
      <rect x="222" y="318" width="572" height="470" rx="36" fill="url(#cover)"/>
      <rect x="222" y="318" width="572" height="470" rx="36" fill="none" stroke="#ffffff" stroke-width="4"/>
      <!-- spine -->
      <rect x="222" y="318" width="54" height="470" rx="27" fill="#9fb2d6" opacity="0.55"/>
      <rect x="222" y="318" width="54" height="470" rx="27" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <!-- bookmark -->
      <path d="M650 318 L 706 318 L 706 470 L 678 448 L 650 470 Z" fill="#ffb648"/>
      <!-- lens -->
      <circle cx="508" cy="556" r="150" fill="#0b1120" opacity="0.32" filter="url(#shB)"/>
      <circle cx="508" cy="548" r="142" fill="url(#ringB)"/>
      <circle cx="508" cy="548" r="124" fill="#0a1222"/>
      <circle cx="508" cy="548" r="110" fill="url(#glassB)"/>
      <circle cx="508" cy="548" r="38" fill="#06101f" opacity="0.88"/>
      <ellipse cx="462" cy="496" rx="42" ry="26" fill="#ffffff" opacity="0.6" transform="rotate(-32 462 496)"/>
      <ellipse cx="556" cy="596" rx="16" ry="10" fill="#c8eeff" opacity="0.45"/>
      <!-- aperture ticks -->
      <g stroke="#7fb2ff" stroke-width="9" stroke-linecap="round" opacity="0.85">
        <path d="M508 374 L 508 402"/><path d="M508 694 L 508 722"/>
        <path d="M334 548 L 362 548"/><path d="M654 548 L 682 548"/>
      </g>
    </g>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  </g>
</svg>
