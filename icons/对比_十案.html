<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#eceff4;font-family:-apple-system,"PingFang SC",sans-serif;color:#1b2436}
.wrap{padding:32px 40px 26px}
h1{font-size:26px;margin:0 0 5px;letter-spacing:.5px}
.sub{color:#5d6b82;font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px 16px}
.cell{background:#fff;border-radius:18px;padding:14px 12px 13px;text-align:center;box-shadow:0 2px 10px rgba(20,35,60,.10)}
.cell img{width:100%;height:auto;display:block;border-radius:22px}
.t{font-size:15px;font-weight:600;margin-top:9px}
.d{font-size:12px;color:#6b7891;margin-top:3px}
.strip{margin-top:22px;background:#fff;border-radius:16px;padding:14px 20px;display:flex;gap:26px;align-items:center;box-shadow:0 2px 10px rgba(20,35,60,.08)}
.strip .lb{font-size:12px;color:#6b7891;width:84px;line-height:1.3}
.s{display:flex;align-items:center;gap:7px}
.s img{border-radius:14px}
.s span{font-size:11px;color:#8492a8}
</style></head><body><div class="wrap">
